name: Temp PDF Watermark Cleaner v2 build
on:
  push:
    branches: [ main ]
    paths:
      - 'tools/pdf-watermark-cleaner-v2/**'
      - '.github/workflows/tmp-pdf-watermark-cleaner-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p tools/pdf-watermark-cleaner-v2 :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp tools/pdf-watermark-cleaner-v2/app/build/outputs/apk/debug/app-debug.apk PDF_Watermark_Cleaner_v2_Object.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_Watermark_Cleaner_v2_Object
          path: PDF_Watermark_Cleaner_v2_Object.apk
          if-no-files-found: error
